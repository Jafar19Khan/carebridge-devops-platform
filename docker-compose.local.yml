services:
  backend:
    environment:
      NODE_ENV: development
      SEED_INITIAL_DATA: "true"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_RECEPTION_EMAIL: ${BOOTSTRAP_RECEPTION_EMAIL:?Set BOOTSTRAP_RECEPTION_EMAIL}
      BOOTSTRAP_RECEPTION_PASSWORD: ${BOOTSTRAP_RECEPTION_PASSWORD:?Set BOOTSTRAP_RECEPTION_PASSWORD}
      BOOTSTRAP_PATIENT_EMAIL: ${BOOTSTRAP_PATIENT_EMAIL:?Set BOOTSTRAP_PATIENT_EMAIL}
      BOOTSTRAP_PATIENT_PASSWORD: ${BOOTSTRAP_PATIENT_PASSWORD:?Set BOOTSTRAP_PATIENT_PASSWORD}
      BOOTSTRAP_DOCTOR_PASSWORD: ${BOOTSTRAP_DOCTOR_PASSWORD:?Set BOOTSTRAP_DOCTOR_PASSWORD}
      PAYMENT_MODE: local
    command: ["sh", "-c", "node scripts/seed.js && node server.js"]

  frontend:
    build:
      args:
        VITE_PAYMENT_MODE: local
